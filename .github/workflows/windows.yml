name: Windows
on:
  push:
    branches: [win]
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm ci
        working-directory: desktop
      - run: npm run win
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm test -- --packaged
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Ready-Library-Windows-x64
          path: desktop/dist/*-win-x64.exe
          if-no-files-found: error
